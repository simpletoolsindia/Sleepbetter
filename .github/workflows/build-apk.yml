name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch real recordings (CC0)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          pip install -q numpy soundfile scipy
          python3 tools/sounds/fetch.py app/src/main/assets/sounds fetched-sounds.json
          cat fetched-sounds.json

      - name: Unit tests (core)
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Render screenshots
        continue-on-error: true
        run: ./gradlew :app:testDebugUnitTest --tests "com.sleepbetter.app.ScreenshotTest" --stacktrace

      - name: Bundle screenshots
        continue-on-error: true
        run: cd app/build/screenshots && zip -q ../../../SleepBetter-screenshots.zip *.png && ls

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SleepBetter-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SleepBetter-debug-apk
          path: |
            SleepBetter-debug.apk
            SleepBetter-screenshots.zip
            fetched-sounds.json

      - name: Publish as a pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SleepBetter debug build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Debug build from `${{ github.ref_name }}` at ${{ github.sha }}.
            Install on Android 8.0+: download SleepBetter-debug.apk on the phone and open it (allow installs from this source when asked).
          files: |
            SleepBetter-debug.apk
            SleepBetter-screenshots.zip
            fetched-sounds.json
